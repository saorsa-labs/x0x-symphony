[package]
name = "x0x-symphony-runner-shell"
description = "Shell process runner and presets for x0x-symphony."
categories = ["development-tools", "command-line-utilities"]
keywords = ["sandbox", "shell", "runner", "process", "task"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
saorsa-sandbox = { path = "../saorsa-sandbox", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"
x0x-symphony-core = { path = "../x0x-symphony-core", version = "0.2.0" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
