[package]
name = "saorsa-sandbox"
description = "Host sandbox planning and probing for x0x-symphony runners."
categories = ["development-tools", "filesystem"]
keywords = ["sandbox", "landlock", "containment", "linux", "security"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tracing = "0.1"
x0x-symphony-core = { path = "../x0x-symphony-core", version = "0.2.0" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
