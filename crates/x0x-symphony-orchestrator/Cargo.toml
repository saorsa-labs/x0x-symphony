[package]
name = "x0x-symphony-orchestrator"
description = "Dispatch orchestrator tying the tracker, runner, and workspace together for x0x-symphony."
categories = ["development-tools", "concurrency", "network-programming"]
keywords = ["orchestration", "scheduler", "distributed", "p2p", "task"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "fs"] }
tracing = "0.1"
x0x-symphony-core = { path = "../x0x-symphony-core", version = "0.1.0" }
x0x-symphony-signing = { path = "../x0x-symphony-signing", version = "0.1.0" }
x0x-symphony-workspace = { path = "../x0x-symphony-workspace", version = "0.1.0" }

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal"] }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
