[package]
name = "x0x-symphony-bin"
description = "Daemon and CLI binaries for x0x-symphony."
categories = ["command-line-utilities", "development-tools", "network-programming"]
keywords = ["cli", "daemon", "distributed", "p2p", "task-orchestration"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "x0x-symphonyd"
path = "src/bin/x0x-symphonyd.rs"

[[bin]]
name = "x0x-symphony"
path = "src/bin/x0x-symphony.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
saorsa-sandbox = { path = "../saorsa-sandbox", version = "0.2.0" }
x0x-symphony-core = { path = "../x0x-symphony-core", version = "0.2.0" }
x0x-symphony-orchestrator = { path = "../x0x-symphony-orchestrator", version = "0.2.0" }
x0x-symphony-runner-shell = { path = "../x0x-symphony-runner-shell", version = "0.2.0" }
x0x-symphony-signing = { path = "../x0x-symphony-signing", version = "0.2.0" }
x0x-symphony-tracker-x0x-crdt = { path = "../x0x-symphony-tracker-x0x-crdt", version = "0.2.0" }
x0x-symphony-workspace = { path = "../x0x-symphony-workspace", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
