[package]
name = "x0x-symphony-signing"
description = "x0xd signing and verification infrastructure for x0x-symphony."
categories = ["cryptography", "authentication"]
keywords = ["ml-dsa", "post-quantum", "signing", "p2p", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
x0x-symphony-core = { path = "../x0x-symphony-core", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
