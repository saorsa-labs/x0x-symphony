name: macOS 15 build proof

# Temporary proof that the release macOS cargo build succeeds on macos-15.
# Removed before this pull request is finished. Does not sign, notarize,
# upload a GitHub Release, or publish crates.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            target: x86_64-apple-darwin
          - platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build workspace with cargo (native)
        run: cargo build --workspace --all-features --release --target ${{ matrix.target }} --bin x0x-symphonyd --bin x0x-symphony

      - name: Record toolchain and deployment target
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          rustc --version
          for bin in x0x-symphonyd x0x-symphony; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            echo "== ${BINARY} =="
            vtool -show-build "$BINARY"
          done
