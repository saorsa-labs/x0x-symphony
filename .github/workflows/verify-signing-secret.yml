name: Verify signing secret

# Dispatch-only utility (XSY-0058 follow-up): proves the org ML_DSA_SECRET_KEY
# decodes — via the exact `base64 --decode` step the sign-release job uses —
# to a raw 4032-byte ML-DSA-65 secret key. Prints ONLY the byte length, never
# key material. Run after any key rotation before firing a release tag.

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode and check length (no key material printed)
        env:
          ML_DSA_SECRET_KEY: ${{ secrets.ML_DSA_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ML_DSA_SECRET_KEY:-}" ]; then
            echo "::error::ML_DSA_SECRET_KEY is empty or not visible to this repo (check org-secret visibility includes public repos)"
            exit 1
          fi
          len=$(printf '%s' "$ML_DSA_SECRET_KEY" | base64 --decode | wc -c | tr -d ' ')
          echo "decoded length: ${len} bytes"
          if [ "$len" != "4032" ]; then
            echo "::error::expected 4032 bytes (raw ML-DSA-65 secret key), got ${len} — see XSY-0058 (6048 = hex text was pasted; 5376-char base64 of the raw key is correct)"
            exit 1
          fi
          echo "OK: ML_DSA_SECRET_KEY decodes to a raw 4032-byte ML-DSA-65 secret key"
