name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Do NOT cancel an in-flight release run — a half-published crate set is
# the worst possible state. A new v* tag push queues behind the current run.
# This workspace publishes 8 crates in sequence, so we must let each run finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# contents: write is required to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  validate-release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Release running for tag ${GITHUB_REF_NAME}."
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual release dry run on ${GITHUB_REF}; select a v* test tag such as v0.0.0-test to mirror a tag push."
          else
            echo "::error::Release workflow only supports v* tag pushes and manual dry runs."
            exit 1
          fi

  # x0x issue #128 lesson: do not build or publish a release tag unless CI
  # succeeds for that tagged commit. Re-run the canonical `just check` on the
  # checked-out ref before any release job starts.
  ci-gate:
    name: CI gate (just check)
    needs: validate-release-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Require canonical CI success for this ref
        run: just check

  # ============================================================
  # Build + sign release binaries for all platforms.
  # Mirrors the x0x release pipeline: real binary packaging,
  # macOS codesign + notarization, Linux strip, SHA-256 checksums.
  # Binaries: x0x-symphonyd (daemon) + x0x-symphony (CLI).
  # ============================================================
  build-release:
    name: Build ${{ matrix.platform }}
    needs: [validate-release-metadata, ci-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_zigbuild: true

          - platform: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            use_zigbuild: true

          - platform: linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_zigbuild: true

          - platform: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            use_zigbuild: false

          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            use_zigbuild: false

          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_zigbuild: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Zig for Linux cargo-zigbuild targets
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild for Linux targets
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build workspace with cargo-zigbuild (Linux cross)
        if: matrix.use_zigbuild
        run: cargo zigbuild --workspace --all-features --release --target ${{ matrix.target }} --bin x0x-symphonyd --bin x0x-symphony

      - name: Build workspace with cargo (native)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --workspace --all-features --release --target ${{ matrix.target }} --bin x0x-symphonyd --bin x0x-symphony

      # ---- macOS Code Signing & Notarization (mirrors x0x) ----
      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS binaries
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for bin in x0x-symphonyd x0x-symphony; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$BINARY"
              codesign --verify --deep --strict "$BINARY"
              echo "Signed ${bin} successfully"
            fi
          done

      # Notarization contacts Apple and validates the Developer Program License
      # Agreement; an expired/unsigned agreement returns HTTP 403 and is an
      # account-level blocker, not a build defect. Binaries are still codesigned,
      # so an un-notarized macOS binary is usable with a Gatekeeper prompt. Keep
      # this non-blocking so a lapsed agreement cannot hold back the Linux/
      # Windows release + crates.io publish; re-run once the agreement is
      # re-signed to ship notarized macOS binaries.
      - name: Notarize macOS binaries
        if: startsWith(matrix.platform, 'macos')
        continue-on-error: true
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          for bin in x0x-symphonyd x0x-symphony; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then
              ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize-${bin}.zip"
              if xcrun notarytool submit "$RUNNER_TEMP/notarize-${bin}.zip" \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait; then
                echo "Notarized ${bin} successfully"
              else
                echo "::warning::Notarization failed for ${bin} (likely an expired Apple Developer agreement); shipping signed-but-un-notarized binary."
              fi
            fi
          done

      - name: Clean up macOS keychain
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      # ---- Strip Linux binaries ----
      - name: Strip binaries (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          for bin in x0x-symphonyd x0x-symphony; do
            BINARY="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BINARY" ]; then strip "$BINARY" || true; fi
          done

      # ---- Package artifacts ----
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          STAGING="x0x-symphony-${{ matrix.platform }}"
          mkdir -p "$STAGING"
          for bin in x0x-symphonyd x0x-symphony; do
            BIN="target/${{ matrix.target }}/release/${bin}"
            if [ -f "$BIN" ]; then cp "$BIN" "$STAGING/"; fi
          done
          cp LICENSE "$STAGING/" 2>/dev/null || true
          cp README.md "$STAGING/" 2>/dev/null || true
          tar czf "x0x-symphony-${{ matrix.platform }}.tar.gz" "$STAGING"
          echo "ASSET=x0x-symphony-${{ matrix.platform }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "x0x-symphony-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $staging -Force
          $daemon = "target/${{ matrix.target }}/release/x0x-symphonyd.exe"
          if (Test-Path $daemon) { Copy-Item $daemon -Destination $staging }
          $cli = "target/${{ matrix.target }}/release/x0x-symphony.exe"
          if (Test-Path $cli) { Copy-Item $cli -Destination $staging }
          if (Test-Path "LICENSE") { Copy-Item LICENSE -Destination $staging }
          if (Test-Path "README.md") { Copy-Item README.md -Destination $staging }
          Compress-Archive -Path "$staging/*" -DestinationPath "x0x-symphony-${{ matrix.platform }}.zip"
          "ASSET=x0x-symphony-${{ matrix.platform }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          hash_cmd="sha256sum"
          if ! command -v sha256sum &>/dev/null; then
            hash_cmd="shasum -a 256"
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            $hash_cmd "x0x-symphony-${{ matrix.platform }}.zip" > "x0x-symphony-${{ matrix.platform }}.zip.sha256"
          else
            $hash_cmd "x0x-symphony-${{ matrix.platform }}.tar.gz" > "x0x-symphony-${{ matrix.platform }}.tar.gz.sha256"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: |
            x0x-symphony-${{ matrix.platform }}.*
          if-no-files-found: error

  # ============================================================
  # ML-DSA-65 sign release archives (post-quantum).
  # Reuses x0x-keygen (same org, same ML_DSA_SECRET_KEY secret) by
  # checking out x0x at a pinned tag, mirroring the x0x pipeline.
  # ============================================================
  sign-release:
    name: ML-DSA-65 Sign Archives
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout x0x-symphony (for LICENSE/README referenced later)
        uses: actions/checkout@v5

      # x0x-keygen is the shared signing tool for saorsa-labs post-quantum
      # archive signatures. Pin to a stable tag so a moving x0x main cannot
      # break symphony's release. Bump deliberately.
      - name: Checkout x0x (for x0x-keygen)
        uses: actions/checkout@v5
        with:
          repository: saorsa-labs/x0x
          ref: v0.28.0
          path: x0x-keygen-src

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            x0x-keygen-src/target
          key: ${{ runner.os }}-sign-cargo-${{ hashFiles('x0x-keygen-src/**/Cargo.lock') }}

      - name: Build x0x-keygen
        run: cargo build --release --manifest-path x0x-keygen-src/Cargo.toml --bin x0x-keygen

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*

      - name: Write ML-DSA-65 signing key
        env:
          ML_DSA_SECRET_KEY: ${{ secrets.ML_DSA_SECRET_KEY }}
        run: |
          echo "$ML_DSA_SECRET_KEY" | base64 --decode > /tmp/release-signing.secret
          chmod 600 /tmp/release-signing.secret

      - name: Sign archives with ML-DSA-65
        run: |
          KEYGEN="x0x-keygen-src/target/release/x0x-keygen"
          for archive in artifacts/release-*/*.tar.gz artifacts/release-*/*.zip; do
            [ -f "$archive" ] || continue
            "$KEYGEN" sign \
              --key /tmp/release-signing.secret \
              --input "$archive" \
              --output "${archive}.sig" \
              --context "x0x-symphony-release-v1"
            echo "Signed: $archive"
          done

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/release-signing.secret

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ml-dsa-signatures
          path: artifacts/release-*/*.sig
          if-no-files-found: error

  # ============================================================
  # GPG-sign release archives and create the GitHub Release.
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [build-release, sign-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*

      - name: Download ML-DSA-65 signatures
        uses: actions/download-artifact@v5
        with:
          name: ml-dsa-signatures
          path: artifacts

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch --yes

      - name: Export public key
        run: |
          gpg --armor --export david@saorsalabs.com > SAORSA_PUBLIC_KEY.asc
          if [ ! -s SAORSA_PUBLIC_KEY.asc ]; then
            echo "Error: Failed to export public key"
            exit 1
          fi

      - name: GPG-sign release archives
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for archive in artifacts/release-*/*.tar.gz artifacts/release-*/*.zip; do
            [ -f "$archive" ] || continue
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --detach-sign --armor --output "${archive}.asc" "$archive" <<< "$GPG_PASSPHRASE"
          done

      - name: Collect all release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          for dir in artifacts/release-*/; do
            cp "$dir"/*.tar.gz release-files/ 2>/dev/null || true
            cp "$dir"/*.zip release-files/ 2>/dev/null || true
            cp "$dir"/*.sha256 release-files/ 2>/dev/null || true
            cp "$dir"/*.asc release-files/ 2>/dev/null || true
            cp "$dir"/*.sig release-files/ 2>/dev/null || true
          done
          cp SAORSA_PUBLIC_KEY.asc release-files/
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          generate_release_notes: true
          body: |
            ## x0x-symphony ${{ github.ref_name }}

            **Distributed Task Orchestration for AI Agents**

            A decentralized, privacy-focused task-orchestration system: sharded
            claim ownership, post-quantum signed claims/handoffs, a consent-gated
            dispatch gate for network-sourced work, and a native Linux Landlock +
            cgroup-v2 sandbox (`#![forbid(unsafe_code)]`). Built on the x0x
            TaskList CRDT backbone and ant-quic transport.

            ### Binaries Included

            - **x0x-symphonyd** — the orchestration daemon (REST API + CLI host)
            - **x0x-symphony** — the operator CLI

            ### Installation

            **From source:**
            ```bash
            cargo install x0x-symphony-bin
            ```

            **Run:**
            ```bash
            x0x-symphonyd --config WORKFLOW.md --data-dir ./data --bind 127.0.0.1:11000
            ```

            See [`docs/symphony/operator.md`](docs/symphony/operator.md) for the
            full worked example, troubleshooting matrix, and the consent-based
            dispatch flow.

            ### Platform Binaries

            | Platform | Archive | Signatures |
            |----------|---------|------------|
            | Linux x64 (glibc) | `x0x-symphony-linux-x64-gnu.tar.gz` | ML-DSA-65 + GPG |
            | Linux x64 (musl/static) | `x0x-symphony-linux-x64-musl.tar.gz` | ML-DSA-65 + GPG |
            | Linux ARM64 | `x0x-symphony-linux-arm64-gnu.tar.gz` | ML-DSA-65 + GPG |
            | macOS x64 (Intel) | `x0x-symphony-macos-x64.tar.gz` | ML-DSA-65 + Apple + GPG |
            | macOS ARM64 (Apple Silicon) | `x0x-symphony-macos-arm64.tar.gz` | ML-DSA-65 + Apple + GPG |
            | Windows x64 | `x0x-symphony-windows-x64.zip` | ML-DSA-65 + GPG |

            All binaries are signed with ML-DSA-65 (post-quantum, `.sig` files)
            and GPG (`.asc` files). macOS binaries are additionally codesigned
            with Apple Developer ID and notarized (notarization is best-effort —
            a signed-but-un-notarized macOS binary runs with a Gatekeeper prompt
            if the Apple Developer Program agreement is mid-renewal).

            ### Verify Signatures

            ```bash
            # Import the Saorsa Labs public GPG key (bundled as SAORSA_PUBLIC_KEY.asc)
            gpg --import SAORSA_PUBLIC_KEY.asc
            gpg --verify x0x-symphony-linux-x64-gnu.tar.gz.asc x0x-symphony-linux-x64-gnu.tar.gz
            ```

            ### CHANGELOG

            See [`CHANGELOG.md`](CHANGELOG.md) for the full M0..M5 history with
            breaking-change and security callouts.

  # ============================================================
  # Publish to crates.io (XSY-0036)
  #
  # Publishes all 8 workspace crates in dependency order per
  # docs/symphony/release-process.md. Each crate uses path+version dual
  # form for internal deps; the version must be indexed before
  # the next dependent can publish. publish_crate() retries on
  # index lag and treats "already uploaded" as success so reruns
  # are safe (idempotent).
  #
  # PREREQUISITE: the CARGO_REGISTRY_TOKEN secret must be set on
  # this repository (or inherited from the saorsa-labs org).
  # ============================================================
  publish-crates:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-latest
    # Publish only on real v* tag pushes, not workflow_dispatch dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve workspace version
        id: ver
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"

      - name: Fail fast if CARGO_REGISTRY_TOKEN is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set."
            echo "Add it with: gh secret set CARGO_REGISTRY_TOKEN -R saorsa-labs/x0x-symphony"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN present."

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail

          # publish_crate <name> [max_tries]
          #   "already uploaded/exists" → idempotent success (safe to rerun)
          #   "no matching package named" or version-not-found → index lag → retry
          #   anything else → hard failure
          publish_crate() {
            local name="$1" max_tries="${2:-5}" try=1
            while :; do
              echo "::group::Try ${try}/${max_tries}: cargo publish -p ${name}"
              set +e
              OUTPUT=$(cargo publish -p "${name}" 2>&1)
              STATUS=$?
              set -e
              echo "$OUTPUT"
              echo "::endgroup::"

              if [ $STATUS -eq 0 ]; then
                echo "::notice::${name} ${{ steps.ver.outputs.version }} published to crates.io"
                return 0
              fi

              # Already on crates.io — idempotent success.
              if echo "$OUTPUT" | grep -qiE "already (uploaded|exists|been uploaded|previously uploaded)"; then
                echo "::notice::${name} ${{ steps.ver.outputs.version }} already on crates.io — treating as success"
                return 0
              fi

              # Index lag: a dependency was just published and is not yet visible
              # to the registry resolver. Retry after a backoff.
              # Rate limit: crates.io throttles bursts of new-crate publishes with
              # HTTP 429 ("too many new crates in a short period"); the window is
              # short (minutes) so retry with a longer backoff.
              if echo "$OUTPUT" | grep -qiE "no matching package named|failed to select a version|failed to find|too many requests|429|rate.?limit|try again after"; then
                if [ $try -lt $max_tries ]; then
                  echo "::notice::${name}: index lag / rate limit on try ${try}/${max_tries}; retrying in 60s"
                  sleep 60
                  try=$((try + 1))
                  continue
                fi
              fi

              echo "::error::cargo publish failed for ${name} (exit $STATUS)"
              return 1
            done
          }

          # ── Dependency order per docs/symphony/release-process.md ──────────────
          # 1. Leaf crate — no internal dependencies.
          publish_crate x0x-symphony-core

          # 2. Depends on x0x-symphony-core.
          publish_crate x0x-symphony-signing

          # 3. Depends on x0x-symphony-core.
          publish_crate saorsa-sandbox

          # 4. Depends on x0x-symphony-core + x0x-symphony-signing.
          publish_crate x0x-symphony-tracker-x0x-crdt

          # 5. Depends on saorsa-sandbox + x0x-symphony-core.
          publish_crate x0x-symphony-runner-shell

          # 6. Depends on x0x-symphony-core.
          publish_crate x0x-symphony-workspace

          # 7. Depends on x0x-symphony-core + x0x-symphony-signing + x0x-symphony-workspace.
          publish_crate x0x-symphony-orchestrator

          # 8. Depends on all of the above; publish LAST.
          publish_crate x0x-symphony-bin

          echo "::notice::All 8 x0x-symphony crates published for ${{ steps.ver.outputs.version }}"
