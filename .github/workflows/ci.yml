name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  just-check:
    name: just check (fmt, clippy, nextest, doc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run canonical workspace validation
        run: just check

      - name: Run live x0xd signing integration tests (if configured)
        env:
          X0XD_URL: ${{ secrets.X0XD_URL }}
          X0XD_TOKEN: ${{ secrets.X0XD_TOKEN }}
        run: |
          if [ -z "${X0XD_URL}" ]; then
            echo "Skipping live x0xd signing tests; configure X0XD_URL (and optional X0XD_TOKEN) to enable them."
            echo "Manual run: X0XD_URL=http://127.0.0.1:<port> cargo test -p x0x-symphony-tracker-git-jsonl --test live_signing -- --ignored --nocapture"
            exit 0
          fi
          RUSTFLAGS="-D warnings" cargo test --workspace -- --ignored

  doc-test:
    name: just doc-test (rustdoc examples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run rustdoc examples
        run: just doc-test

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  windows-check:
    # Guard against platform-specific escapes: the v0x0.M1 release matrix
    # failed on windows-x64 because `tokio::process::Child` was imported only
    # under #[cfg(unix)] while the non-unix fallback still referenced it, and
    # nothing in CI ever compiled the workspace for Windows. This job compiles
    # the shipped library + binary code for Windows on every push so that class
    # of defect cannot recur. Uses `cargo check` (no --all-targets) deliberately:
    # the test suites are unix-cfg-gated and pull `nix`, a unix-only dev-dependency.
    name: cargo check (Windows compile gate)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      - name: Check workspace compiles for Windows
        run: cargo check --workspace --all-features
